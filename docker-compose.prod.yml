# Production stack for a single VPS (Hetzner + Coolify, or plain Docker).
# Coolify provides TLS + reverse proxy; if running standalone, add Caddy/Nginx.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "3000:3000"
    volumes:
      # Persist uploaded PDFs/images across redeploys (local-disk storage).
      - app_storage:/app/storage
    healthcheck:
      # Auto-restart on hang, not just crash.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      piston:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    # Tuned for a 4GB CPX21 shared with the app + Piston + Coolify.
    # (shared_buffers must NEVER exceed ~25% of box RAM — 4GB here = OOM.)
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=1536MB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "max_connections=50"
      - "-c"
      - "log_min_duration_statement=500"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Self-hosted code sandbox. Install languages once via /api/v2/packages.
  piston:
    image: ghcr.io/engineer-man/piston:latest
    restart: unless-stopped
    privileged: true
    volumes:
      - piston_packages:/piston/packages
    # Internal only — the app reaches it at http://piston:2000.

volumes:
  pgdata:
  piston_packages:
  app_storage:

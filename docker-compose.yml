services:
  postgres:
    image: postgres:16-alpine
    container_name: academic-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: academic
    ports:
      - "5432:5432"
    volumes:
      - academic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d academic"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  academic_pgdata:

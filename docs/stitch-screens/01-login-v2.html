<style>
        .dotted-pattern {
            background-image: radial-gradient(circle, #707973 1px, transparent 1px);
            background-size: 24px 24px;
            opacity: 0.15;
        }
        
        .mesh-gradient {
            background: 
                radial-gradient(circle at 20% 20%, #F6A488 0%, transparent 40%),
                radial-gradient(circle at 80% 40%, #544dc4 0%, transparent 40%),
                radial-gradient(circle at 40% 80%, #1F8765 0%, transparent 40%);
            filter: blur(80px);
            opacity: 0.18;
        }

        .hand-drawn-underline {
            position: relative;
            display: inline-block;
        }

        .hand-drawn-underline::after {
            content: '';
            position: absolute;
            left: -2%;
            bottom: 4px;
            width: 104%;
            height: 4px;
            background-color: #F6A488;
            border-radius: 50% 40% 50% 40%;
            z-index: -1;
            animation: drawUnderline 1.2s cubic-bezier(0.65, 0, 0.35, 1) forwards;
            transform-origin: left;
        }

        @keyframes drawUnderline {
            from { transform: scaleX(0); }
            to { transform: scaleX(1); }
        }

        .shape-float {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .pop-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06), 0 20px 40px -10px rgba(0, 0, 0, 0.04);

<!-- Global Interactions Script -->
<script>
        // Password Toggle Script
        const toggleBtn = document.querySelector('button[type="button"]');
        const passwordInput = document.querySelector('#password');
        
        toggleBtn?.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            toggleBtn.querySelector('span').textContent = type === 'password' ? 'Show' : 'Hide';
        });

        // Form Submit Visual Feedback
        const loginBtn = document.querySelector('button.bg-primary');
        loginBtn?.addEventListener('click', () => {
            loginBtn.classList.add('opacity-80');
            const originalContent = loginBtn.innerHTML;
            loginBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Authenticating...';
            
            setTimeout(() => {
                loginBtn.classList.remove('opacity-80');
                loginBtn.innerHTML = originalContent;
            }, 1200);
        });
    </script>
